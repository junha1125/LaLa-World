- {kind: policy_jsonl, path: "${LALA_DATA_ROOT}/cosmos_robocasa/jsonl/robocasa.jsonl", stats_path: "${LALA_DATA_ROOT}/cosmos_robocasa/stats.json", views: [primary], chunk_size: 32}
