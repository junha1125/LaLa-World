- {kind: policy_jsonl, path: "${LALA_DATA_ROOT}/cosmos_libero/jsonl/libero_goal.jsonl", stats_path: "${LALA_DATA_ROOT}/cosmos_libero/stats.json", views: [primary], chunk_size: 16}
- {kind: policy_jsonl, path: "${LALA_DATA_ROOT}/cosmos_libero/jsonl/libero_goal.jsonl", stats_path: "${LALA_DATA_ROOT}/cosmos_libero/stats.json", views: [wrist], chunk_size: 16}
